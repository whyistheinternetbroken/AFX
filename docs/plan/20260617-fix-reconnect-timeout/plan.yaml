plan_id: 20260617-fix-reconnect-timeout
objective: >
  Fix the benign 5-second prompt-poll timeout during post-reinit reconnect in
  AFX_reinit.py. Two call sites use direct_read_until / direct_read_until_any
  with timeout=5; during mid-reboot console silence (after option 6 / reinit)
  both time out, producing noisy WARN log entries and, for Path B, potentially
  triggering an unneeded system reset. Surgical fix: raise both timeouts to 15 s.
created_at: "2026-06-17"
created_by: gem-planner
status: pending
research_confidence: high

plan_metrics:
  wave_1_task_count: 1
  total_dependencies: 1
  risk_score: low

tldr: |
  Two call sites in AFX_reinit.py use direct_read_until / direct_read_until_any
  with timeout=5. During post-reinit reconnect the LOADER console is silent
  for up to ~12 s while nodes reboot, causing both probes to time out:

    Path A  handle_loader_commands (~line 22885)
            Sends CR → waits for "LOADER-" echo.
            Miss is benign (continues anyway), but generates a false WARN log entry.

    Path B  _already_at_loader (~line 6316)
            Final tiebreaker probe after the main probe_timeout loop.
            Miss → returns False → _bmc_reach_loader issues system reset
            (after two back-to-back false negatives: probe_timeout=25 then 45).

  Fix: change timeout=5 → timeout=15 at both sites. No control-flow, no
  signatures, no callers change. Two edited lines, one file. Validated by
  grep + syntax check + manual post-reinit smoke test.

open_questions: []
gaps: []

pre_mortem:
  overall_risk_level: low
  critical_failure_modes:
    - scenario: >
        15 s probe delay on a genuinely absent node lengthens the time before
        _bmc_reach_loader falls through to system reset.
      likelihood: low
      impact: low
      mitigation: >
        The Path-B site is the final tiebreaker inside _already_at_loader, which
        is already called twice by _bmc_reach_loader (probe_timeout=25 then 45).
        Total pre-reset wait grows by ≤20 s (10 s extra per call × 2 calls), a
        negligible increase on a baseline of 70+ s. The system reset path is
        preserved; only the threshold moves.
    - scenario: >
        Path A timeout increase causes handle_loader_commands to block longer
        on a dead paramiko channel.
      likelihood: low
      impact: low
      mitigation: >
        handle_loader_commands already falls through unconditionally on timeout
        (prints warning, does not abort). A dead channel raises an exception
        (socket.error / EOFError), not a timeout, so the 15 s upper bound is
        never actually reached in the dead-channel case.
    - scenario: >
        Wrong line targeted due to file growth between code-reading and edit,
        causing a different timeout= argument to be patched.
      likelihood: low
      impact: medium
      mitigation: >
        Implementer must grep for the exact call signature strings before editing.
        Use context-aware string replacement (old_str → new_str). Verify with a
        post-edit grep that exactly two instances changed.
  assumptions:
    - Post-reinit console silence is transient (< 12 s); lab observations confirm
      the LOADER prompt appears within ~8–10 s of node reboot completion.
    - No other callers pass an explicit timeout= override to direct_read_until /
      direct_read_until_any at these two sites.
    - _bmc_reach_loader calls _already_at_loader twice (probe_timeout=25 then 45)
      before issuing system reset, so the final 5 s fallback is not the primary
      gate and raising it to 15 s does not change the safety semantics.

implementation_specification:
  code_structure: >
    Single file edit in AFX_reinit.py. Two keyword-argument changes (timeout=5
    → timeout=15). No new functions, no new imports, no control-flow changes.
  affected_areas:
    - "handle_loader_commands (~line 22885) — Path A"
    - "_already_at_loader (~lines 6316–6322) — Path B"
  component_details:
    - component: handle_loader_commands
      responsibility: >
        After the calling loop has confirmed LOADER is active, sends a bare CR
        and waits for the LOADER prompt to echo back before issuing boot
        commands. A timeout miss is already handled gracefully (warning + continue).
      interfaces:
        - "direct_read_until(channel, \"LOADER-\", timeout=<N>)"
      dependencies:
        - component: direct_read_until
          relationship: reads from paramiko channel with a deadline
      integration_points:
        - Called by the main reconnect-to-LOADER dispatch after LOADER confirmed

    - component: _already_at_loader
      responsibility: >
        Probes whether the node is already at the LOADER prompt so that
        _bmc_reach_loader can skip a destructive system reset. The final
        direct_read_until_any call is a last-chance tiebreaker executed when
        the main probe_timeout loop expires without finding the LOADER prompt.
        If it also misses, the function returns False and _bmc_reach_loader
        proceeds to system reset.
      interfaces:
        - "direct_read_until_any(channel, [\"loader-\", \"::>\", ...], timeout=<N>, quiet=True)"
      dependencies:
        - component: direct_read_until_any
          relationship: reads from paramiko channel with a deadline
        - component: _bmc_reach_loader
          relationship: >
            Caller; calls _already_at_loader(probe_timeout=25) then
            _already_at_loader(probe_timeout=45) before deciding system reset
      integration_points:
        - Final safety net inside _already_at_loader before returning False

