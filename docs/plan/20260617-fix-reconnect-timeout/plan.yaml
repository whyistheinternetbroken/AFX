tasks:

  - id: fix-loader-timeouts
    title: Raise direct_read_until timeout from 5 s to 15 s at both reconnect sites
    description: |
      Edit AFX_reinit.py at exactly two locations. Verify exact line context
      with grep before editing.

      ─── SITE 1: handle_loader_commands (~line 22885) ────────────────────────

        CONTEXT (lines ~22882–22887):
          # Send a bare CR to provoke a fresh LOADER prompt echo; the calling
          # loop already confirmed LOADER is active, so this should respond
          # instantly.
          channel.send("\r")
          output = direct_read_until(channel, "LOADER-", timeout=5)
          if "loader-" not in output.lower():

        CHANGE:
          BEFORE:  output = direct_read_until(channel, "LOADER-", timeout=5)
          AFTER:   output = direct_read_until(channel, "LOADER-", timeout=15)

        WHY: Post-reinit console repaint can suppress the LOADER echo for
        ~8–12 s while the node is mid-reboot. The current 5 s deadline fires
        too early and writes a false WARN entry to the session log. The code
        already continues unconditionally, so only the log noise changes.

      ─── SITE 2: _already_at_loader (~lines 6316–6322) ──────────────────────

        CONTEXT (lines ~6313–6322):
          if not loader_found:
              # Final short blocking probe: some consoles emit the prompt only
              # after a delayed repaint, so do one last focused read before
              # deciding reset.
              _tail_out, _tail_match = direct_read_until_any(
                  channel,
                  ["loader-", "::>", "::*>", "login:", "selection", "autoboot", ">"],
                  timeout=5,
                  node_log=node_log,
                  quiet=True,
              )

        CHANGE:
          BEFORE:  timeout=5,
          AFTER:   timeout=15,

        WHY: This fallback fires when the main probe_timeout loop (25 s or
        45 s) exhausts without finding the LOADER prompt. A 5 s tiebreaker
        is too short when the console is still replaying reboot output. Raising
        to 15 s gives the prompt time to surface before _bmc_reach_loader
        issues a (potentially unnecessary) system reset.

      ─── DO NOT CHANGE ────────────────────────────────────────────────────────
        • Any other timeout= arguments in these or any other functions
        • The warning message "No LOADER prompt seen, attempting commands anyway..."
        • Control flow, return values, or function signatures
        • Any lines outside the two timeout= keyword arguments above
