  - id: add-netboot-subtimings
    title: Emit download and install subtimings under Netboot ONTAP Install (GAP-2, GAP-3)
    description: |
      Single function edit: _run_netboot_install_sequence() in AFX_reinit.py.
      Add two subtiming calls. All changes are inside this one function.

      ─── CONTEXT ─────────────────────────────────────────────────────────────

        Function signature (~line 11823):
          def _run_netboot_install_sequence(channel, pkg_url, node_label="node",
                                            log=None, boot_menu_timeout=900,
                                            node_file=None, status_cb=None,
                                            static_ifconfig=None):

        The function already receives `log` (a SessionLog or None) and already
        has `_dl_t0 = time.monotonic()` at the start of each retry attempt
        (~line 11948). The inner closure `_do_reboot()` (~line 12092) is where
        the install phase ends (node reboots).

      ─── PART A: Download subtiming (GAP-2) ─────────────────────────────────

        STEP 1 — Before the retry for-loop (~line 11927, just before
                  `for _nb_attempt in range(1, _NETBOOT_MAX_ATTEMPTS + 1):`),
                  add a download-phase start timer that spans ALL attempts:

                    _dl_phase_start = time.monotonic()

                  (This is DIFFERENT from _dl_t0 which is reset each attempt
                   and drives only the per-attempt progress thread.)

        STEP 2 — At the `if menu_detected: break` line inside the retry loop
                  (~line 11998), just BEFORE the `break`, add:

                    if log:
                        _dl_elapsed = time.monotonic() - _dl_phase_start
                        log.add_phase_subtiming(
                            "Netboot ONTAP Install",
                            f"[{node_label}] image download",
                            _dl_elapsed,
                        )

      ─── PART B: Install subtiming (GAP-3) ──────────────────────────────────

        STEP 1 — After the option-7 send (`_send_raw("7")` ~line 12050) and the
                  `time.sleep(2)` that follows it, capture an install-phase start:

                    _inst_phase_start = time.monotonic()

        STEP 2 — Inside the `_do_reboot()` closure (~line 12092), just BEFORE
                  `_send_raw("y")`, add:

                    if log:
                        _inst_elapsed = time.monotonic() - _inst_phase_start
                        log.add_phase_subtiming(
                            "Netboot ONTAP Install",
                            f"[{node_label}] image install",
                            _inst_elapsed,
                        )

                  The closure captures `log`, `node_label`, and `_inst_phase_start`
                  from the enclosing scope — Python closures handle this automatically.

      ─── TIMING SCOPE RATIONALE ──────────────────────────────────────────────

        Download timer: starts before ANY attempt; ends when the boot menu is
        detected. On a single-attempt run this matches the user-visible download.
        On a retry run, it captures total download wall time including the 10-s
        retry sleep — the honest number to show.

        Install timer: starts after option 7 is accepted; ends at the reboot
        prompt. Captures the option-7 install sequence only. If _do_reboot() is
        never reached (timeout or early-exit paths), no subtiming is emitted —
        which is correct; a failed install should not appear in the summary.

      ─── DO NOT CHANGE ────────────────────────────────────────────────────────
        • _dl_t0 or the per-attempt progress thread (_dl_thread)
        • Any retry logic or fail-path return statements
        • The function signature or any caller
        • Any existing log.log() calls
