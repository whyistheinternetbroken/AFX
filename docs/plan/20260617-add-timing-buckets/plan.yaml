plan_id: 20260617-add-timing-buckets
objective: >
  Add more detail to the summary timing breakdown in AFX_reinit.py and reduce
  the unaccounted-time bucket where possible by addressing five identified gaps:
  pause-time accumulation (GAP-1), netboot image download subtiming (GAP-2),
  netboot image install subtiming (GAP-3), Auto Join phase for mode-2 single-node
  (GAP-4), and wizard-start wait subtiming (GAP-5, excluded by design).
created_at: "2026-06-17"
created_by: gem-planner
status: pending
research_confidence: high

plan_metrics:
  wave_1_task_count: 3
  total_dependencies: 3
  risk_score: low

tldr: |
  The run-summary "Unaccounted time" bucket is inflated by three distinct
  sources that are currently invisible to the phase-timing system:

    GAP-1  _wait_if_paused() burns wall-clock time but accumulates no counter.
           The pause duration is subtracted from neither the unaccounted formula
           nor displayed as its own line item.  Fix: mirror the existing
           _prompt_wait_seconds pattern — add _pause_wait_seconds + count globals,
           accumulate in _wait_if_paused, subtract from the unaccounted formula in
           both close() and _write_summary_file(), and emit a "Pause wait" row.

    GAP-2  _run_netboot_install_sequence() downloads the ONTAP image (netboot
           cmd → boot-menu detected) without emitting a subtiming under the
           "Netboot ONTAP Install" phase.  The function already receives log= and
           already sets _dl_t0 = time.monotonic() for the progress thread; a
           single log.add_phase_subtiming() call at menu_detected exhausts the gap.

    GAP-3  _run_netboot_install_sequence() also runs the option-7 install sequence
           (option 7 → reboot triggered) without a subtiming.  A second timer
           captured before the "7" is sent and a log.add_phase_subtiming() call
           inside _do_reboot() (closure already has access to enclosing scope)
           closes this gap with ~10 lines.

    GAP-4  auto_complete_join() already calls start_phase("Auto Join (2b)") but:
           (a) the "(2b)" suffix is inconsistent with the recommended name "Auto
           Join"; (b) exactly one early-exit path (line ~19193) returns without
           confirming end_phase(); investigation required.  Fix: rename the phase
           to "Auto Join" and audit all exit paths for end_phase() hygiene.

    GAP-5  EXCLUDED.  _wait_if_paused("wizard-start wait") at line ~9844 is inside
           _wait_for_wizard_start() which does not receive a log reference; wiring
           one in would require signature changes across the call chain.  The
           wizard-start wait is already covered by the enclosing "Auto Join" phase
           (GAP-4) and any pause time within it is captured by GAP-1.  Including
           GAP-5 would raise change risk without meaningfully shrinking the
           unaccounted bucket.

  All changes are in AFX_reinit.py.  Three independent Wave-1 implementation
  tasks (one per logical change group) parallelize safely; a single Wave-2
  documentation task follows.

