pre_mortem:
  overall_risk_level: low
  critical_failure_modes:
    - scenario: >
        GAP-1 formula change introduces a double-subtraction: pause time is
        subtracted once as part of prompt_wait (if a pause fires inside a prompt
        wrapper) and again via the new _pause_wait_seconds term.
      likelihood: low
      impact: medium
      mitigation: >
        _wait_if_paused() is called from the run loop and I/O helpers, not from
        inside the _timed_input wrapper.  The prompt-wait accumulator fires only
        inside _timed_input (the instrumented input() replacement).  The two
        accumulators are disjoint by construction.  Implementer must verify no
        _wait_if_paused() call site is nested inside _timed_input before shipping.
    - scenario: >
        GAP-2/3 subtiming node_label baked into the label string causes the
        "Netboot ONTAP Install" subtimings dict to grow unboundedly when many
        nodes are installed in parallel (mode-4b multi-node).
      likelihood: low
      impact: low
      mitigation: >
        add_phase_subtiming() appends to a list; any number of entries renders
        correctly in the summary table (one row per entry).  Memory impact for
        typical cluster sizes (≤24 nodes) is negligible.
    - scenario: >
        Renaming "Auto Join (2b)" breaks a hardcoded string reference elsewhere
        (e.g., set_phase_outcome, _infer_failure_stage, or a test).
      likelihood: low
      impact: low
      mitigation: >
        Grep for "Auto Join (2b)" across the entire file before and after the
        rename.  The string appears only in start_phase(); no other reference
        exists.  Confirm with grep post-edit.
    - scenario: >
        GAP-2/3 download timer is reset inside the retry loop, causing the
        subtiming to reflect only the last download attempt rather than total
        download time.
      likelihood: medium
      impact: low
      mitigation: >
        Capture _dl_phase_start OUTSIDE the retry loop (before the for _nb_attempt
        loop at line ~11927) so that retries accumulate into the same interval.
        The existing _dl_t0 is reset per attempt (it drives the per-attempt
        progress thread); a separate _dl_phase_start must be introduced.
  assumptions:
    - _wait_if_paused() is never called from inside the _timed_input closure,
      keeping the pause and prompt accumulators disjoint.
    - The "Netboot ONTAP Install" phase name string is stable; no caller renames
      it between the phase start and the add_phase_subtiming() calls.
    - auto_complete_join() is the sole code path that starts the "Auto Join"
      phase; _run_join_wizard() is only called from auto_complete_join().
    - GAP-5 (wizard-start wait subtiming) is intentionally excluded; its
      contribution to unaccounted time is subsumed by the "Auto Join" phase
      and the new pause accumulator.

implementation_specification:
  code_structure: >
    Single file: AFX_reinit.py (~29 000 lines).  All changes are additive
    (new globals, new accumulator calls, new subtiming calls, one rename) with
    no control-flow alterations and no new function signatures except the
    internal _do_reboot() closure which gains a captured variable.
  affected_areas:
    - "Module-level globals block (~line 1184) — new _pause_wait_seconds / _pause_wait_count"
    - "_wait_if_paused() (~line 3694) — pause duration accumulation"
    - "_run_netboot_install_sequence() (~lines 11927–12172) — download + install subtimings"
    - "auto_complete_join() (~line 19141) — phase rename 'Auto Join (2b)' → 'Auto Join'"
    - "SessionLog.close() (~line 2424–2446) — unaccounted formula + pause row"
    - "SessionLog._write_summary_file() (~line 2551–2570) — same as close()"
  component_details:
    - component: _pause_wait_seconds / _pause_wait_count
      responsibility: >
        Module-level accumulators for total pause time (seconds) and pause-event
        count. Mirror the existing _prompt_wait_seconds / _prompt_wait_count pattern.
        Protected by a new threading.Lock() (_pause_wait_lock).
      interfaces:
        - "_pause_wait_seconds: float  (global)"
        - "_pause_wait_count: int  (global)"
        - "_pause_wait_lock: threading.Lock  (global)"
      dependencies:
        - component: _wait_if_paused
          relationship: sole writer; increments both globals at function exit
      integration_points:
        - SessionLog.close() reads _pause_wait_seconds for the formula
        - SessionLog._write_summary_file() reads _pause_wait_seconds for the formula

    - component: _wait_if_paused (modified)
      responsibility: >
        Existing blocker; now also measures its own wall-clock duration with
        time.monotonic() and increments _pause_wait_seconds / _pause_wait_count
        at exit (whether pause ran or not — guard: only add if elapsed > 0).
      interfaces:
        - "def _wait_if_paused(context: str = 'automation') -> None"
      dependencies:
        - component: _pause_wait_seconds / _pause_wait_count
          relationship: writes via _pause_wait_lock
      integration_points:
        - Called from run-loop, boot-menu wait, I/O loop — all paths accumulate

    - component: _run_netboot_install_sequence (modified)
      responsibility: >
        Existing installer; now emits two subtimings under the 'Netboot ONTAP
        Install' phase: (a) download elapsed from before the first netboot
        command send to boot-menu detected, (b) install elapsed from option-7
        send to reboot trigger inside _do_reboot().
      interfaces:
        - "log.add_phase_subtiming('Netboot ONTAP Install', f'[{node_label}] image download', elapsed)"
        - "log.add_phase_subtiming('Netboot ONTAP Install', f'[{node_label}] image install', elapsed)"
      dependencies:
        - component: SessionLog.add_phase_subtiming
          relationship: called when log is not None
      integration_points: >
        Subphase labels include node_label so parallel multi-node installs (mode-4b,
        mode-3) produce labelled rows per node. Phase name must match the literal
        used by start_phase() callers (~line 22973 and ~line 12301 area).

    - component: auto_complete_join (modified)
      responsibility: >
        Existing mode-2 join driver; phase renamed from "Auto Join (2b)" to
        "Auto Join" for naming consistency. All three end_phase() exit paths
        verified present and unchanged.
      interfaces:
        - "_session_log.start_phase('Auto Join')"
      dependencies:
        - component: SessionLog
          relationship: start_phase / end_phase bookend
      integration_points:
        - Called from monitor_for_autoboot_and_loader when _auto_add is True
        - Phase timeline replaces the previous "AUTOBOOT/LOADER Monitoring" active slice

    - component: SessionLog.close / _write_summary_file (modified)
      responsibility: >
        Both summary-writing methods updated to: (1) subtract _pause_wait_seconds
        from the unaccounted formula, (2) emit a "Pause wait" line item directly
        above the existing "Unaccounted time" line. Pattern mirrors the existing
        prompt-wait block.
      interfaces:
        - "_pw = float(_prompt_wait_seconds)"
        - "_pause_w = float(_pause_wait_seconds)"
        - "_unaccounted = max(0.0, total_elapsed - _phase_sum - _pw - _pause_w)"
      dependencies:
        - component: _pause_wait_seconds
          relationship: reads at summary generation time
      integration_points:
        - Output appears in both the full session log and the standalone summary file

