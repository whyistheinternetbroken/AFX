  - id: add-auto-join-phase
    title: Rename Auto Join phase and audit exit-path hygiene (GAP-4)
    description: |
      Targeted rename + exit-path audit in auto_complete_join() (~line 19131).

      ─── STEP 1: Rename the phase string ─────────────────────────────────────

        LOCATE (~line 19141):
          _session_log.start_phase("Auto Join (2b)")

        CHANGE TO:
          _session_log.start_phase("Auto Join")

        This is the only start_phase call for this phase; grep confirms no other
        "Auto Join (2b)" string exists in the file.

