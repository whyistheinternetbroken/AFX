tasks:

  # ── WAVE 1 ─────────────────────────────────────────────────────────────────

  - id: add-pause-accumulator
    title: Accumulate pause time and subtract from unaccounted formula (GAP-1)
    description: |
      Three-part change in AFX_reinit.py, all purely additive:

      ─── PART A: New globals (~line 1184, beside _prompt_wait_seconds block) ──

        Add after the existing `_prompt_wait_extended = []` line:

          _pause_wait_seconds = 0.0
          _pause_wait_count   = 0
          _pause_wait_lock    = threading.Lock()

        These mirror the existing _prompt_wait_seconds / _prompt_wait_lock pattern.

      ─── PART B: Accumulate in _wait_if_paused (~line 3694) ──────────────────

        At the TOP of _wait_if_paused(), before `_process_runtime_requests(context)`,
        capture the entry time:

          _pwp_start = time.monotonic()

        At the BOTTOM of _wait_if_paused(), after the final `_pause_announced = False`
        block (i.e., just before the function returns), accumulate:

          _pwp_elapsed = time.monotonic() - _pwp_start
          if _pwp_elapsed > 0:
              global _pause_wait_seconds, _pause_wait_count
              with _pause_wait_lock:
                  _pause_wait_seconds += _pwp_elapsed
                  _pause_wait_count   += 1

        IMPORTANT: Only accumulate if the function was actually called (_pwp_elapsed > 0
        is always true on return, but this guards against future refactors). Do NOT
        change any existing logic in _wait_if_paused().

      ─── PART C: Summary formula + row (two mirrored locations) ──────────────

        Locations: SessionLog.close() (~line 2427) AND
                   SessionLog._write_summary_file() (~line 2551).
        Both blocks are structurally identical; apply the same change to each.

        CURRENT (example from close()):
          _pw = float(_prompt_wait_seconds)
          _phase_sum = sum(self._phase_times.values()) if self._phase_times else 0.0
          _unaccounted = max(0.0, total_elapsed - _phase_sum - _pw)
          self._file.write(
              f"  {'Time waiting for prompts (x' + str(_prompt_wait_count) + ')':<45} "
              f"{_pw:>7.1f}s ({_pw/60:.1f}m)\n"
          )
          # ... extended-wait lines ...
          self._file.write(
              f"  {'Unaccounted time':<45} {_unaccounted:>7.1f}s ({_unaccounted/60:.1f}m)\n"
          )

        AFTER (insert _pause_w into formula; add row between prompts row and
               unaccounted row — emit only when _pause_wait_count > 0):
          _pw      = float(_prompt_wait_seconds)
          _pause_w = float(_pause_wait_seconds)
          _phase_sum    = sum(self._phase_times.values()) if self._phase_times else 0.0
          _unaccounted  = max(0.0, total_elapsed - _phase_sum - _pw - _pause_w)
          self._file.write(
              f"  {'Time waiting for prompts (x' + str(_prompt_wait_count) + ')':<45} "
              f"{_pw:>7.1f}s ({_pw/60:.1f}m)\n"
          )
          # ... existing extended-wait lines (unchanged) ...
          if _pause_wait_count > 0:
              self._file.write(
                  f"  {'Pause wait (x' + str(_pause_wait_count) + ')':<45} "
                  f"{_pause_w:>7.1f}s ({_pause_w/60:.1f}m)\n"
              )
          self._file.write(
              f"  {'Unaccounted time':<45} {_unaccounted:>7.1f}s ({_unaccounted/60:.1f}m)\n"
          )

        Apply identically to _write_summary_file() (replace self._file.write with sf.write).

      ─── DO NOT CHANGE ────────────────────────────────────────────────────────
        • Any existing logic in _wait_if_paused (pause loop, auto-clear, lock)
        • _prompt_wait_seconds / _prompt_wait_count variables or formula
        • Any other accumulators or summary rows
