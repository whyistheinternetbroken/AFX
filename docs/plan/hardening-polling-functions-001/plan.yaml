plan_id: hardening-polling-functions-001
objective: |
  Harden 3 critical polling functions (_wait_for_failover_state, _wait_for_cluster_healthy,
  _wait_for_cluster_nodes_healthy) with reconnect retry logic (3 rounds × 60s) using the
  pattern established in option 4a's _safe_poll() implementation.
created_at: "2024-01-20T00:00:00Z"
created_by: gem-planner
status: pending
research_confidence: high
plan_metrics:
  wave_1_task_count: 2
  total_dependencies: 3
  risk_score: medium

tldr: |
  Retrofit three polling functions with a proven 3-round reconnect-retry pattern (60s waits)
  to gracefully handle transient socket closures during LIF migrations. This mirrors the
  successful _safe_poll() implementation (lines 17398–17464) and extends recovery window
  from single timeout to 3×60s + timeout. Wave 1 hardens the two simpler functions in parallel;
  Wave 2 hardens the complex triple-command function; Wave 3 validates integration and updates docs.

open_questions:
  - question: "Should T2 (_wait_for_cluster_healthy) retry all 3 commands as one atomic block, or per-command?"
    context: |
      _wait_for_cluster_healthy runs 3 sequential commands (failover show, giveback show, port show).
      If connection drops mid-sequence (e.g., after failover show), do we re-run all 3, or resume
      from the failed command? Current assumption: retry entire block (simpler, matches 4a pattern).
    type: decision_blocker
    affects: ["hardening-cluster-healthy"]
  - question: "Do we need a separate _safe_poll()-like helper function, or inline the retry logic?"
    context: |
      _safe_poll() is a nested helper within the takeover context. For these global functions,
      should we create a reusable _retry_with_reconnect() helper to avoid duplication, or inline
      for clarity? Recommendation: inline initially (less abstraction risk); refactor if duplicated >2x.
    type: nice_to_know
    affects: ["hardening-failover-state", "hardening-cluster-healthy", "hardening-cluster-nodes"]
  - question: "Does _wait_for_cluster_nodes_healthy need cluster port health check inside or outside retry?"
    context: |
      _wait_for_cluster_nodes_healthy calls _cluster_port_health_issues(). Should port health be
      checked inside retry loop, or deferred to next iteration? Current approach: inside (catches
      transient port issues during migration).
    type: research
    affects: ["hardening-cluster-nodes"]

