pre_mortem:
  overall_risk_level: medium
  critical_failure_modes:
    - scenario: |
        Retry loop never detects socket closure (socket.error not raised), causing polling
        to hang indefinitely if connection is half-open or stalled.
      likelihood: medium
      impact: high
      mitigation: |
        - Test with real socket closure injection (kill TCP connection mid-command)
        - Add connection timeout to underlying SSH channel (_run_cluster_command default 30s)
        - Log every command attempt with timestamp and exception type for debugging
    - scenario: |
        Retry loop holds open stale socket connection, preventing LIF migration from completing.
        60s wait may be insufficient for actual migration time in high-load scenarios.
      likelihood: low
      impact: high
      mitigation: |
        - Ensure _open_poll_channel() / _open_cluster_channel() properly closes stale connections
        - Monitor actual LIF migration times in test labs; adjust 60s if needed
        - Log socket state before/after each retry attempt
    - scenario: |
        _wait_for_cluster_healthy retry loop restarts all 3 commands, causing state inconsistency
        if cluster becomes unhealthy between failover show and port show checks.
      likelihood: low
      impact: medium
      mitigation: |
        - Document that re-running all 3 commands is atomic from caller perspective (acceptable)
        - Verify each check independently tolerates partial cluster state
        - Add log entries showing start/end of each command block within retry
    - scenario: |
        Parallel execution of T1 + T3 in Wave 1 causes merge conflicts if both modify
        the same utility functions or shared imports.
      likelihood: low
      impact: medium
      mitigation: |
        - T1 and T3 are isolated functions; no shared edit scope
        - T2 depends on Wave 1 passing, ensuring pattern is validated before complex retry
  assumptions:
    - Three polling functions are in the same file (AFX_reinit.py) and can be edited independently
    - Socket closure during polling is the primary failure mode addressed by _safe_poll() pattern
    - 3 rounds × 60s retry window is acceptable per business decision; no change to total_timeout
    - Caller of these functions tolerates 180s additional latency (3×60s retries) before timeout
    - _open_poll_channel() and _open_cluster_channel() properly close and release socket resources
    - Existing log infrastructure (_session_log, log parameter) is available in all three functions

implementation_specification:
  code_structure: |
    Each polling function will gain an inner try/except wrapper that:
    1. Attempts current polling logic (1 try)
    2. On socket.error or connection timeout: enters retry loop
    3. Retry loop: 3 rounds, 60s sleep between, attempts to reconnect/re-poll
    4. If all retries fail: return False or raise exception (preserve current behavior)
    
    Pattern (from _safe_poll, lines 17398–17464):
    ```python
    for _attempt in range(2):  # 1st attempt + 1 retry
        try:
            # polling logic here
            return success
        except Exception as _e:
            if _attempt == 0:
                # Retry reconnect: 3 rounds, 60s apart
                for _r in range(3):
                    if _r > 0:
                        print(f"  ⏳ Waiting 60s... (round {_r + 1}/3)")
                        if log: log.log("...", prefix="WARN")
                        time.sleep(60)
                    if _open_channel():
                        # Successfully reconnected
                        break
            else:
                # 2nd attempt failed — unrecoverable
                if log: log.log("Unrecoverable", prefix="ERROR")
    return False
    ```
    
    This structure decouples polling logic (unchanged) from retry logic (new).
  
  affected_areas:
    - Function: _wait_for_failover_state (line 15904)
    - Function: _wait_for_cluster_healthy (line 15990)
    - Function: _wait_for_cluster_nodes_healthy (line 19712)
    - Utility: _run_cluster_command (unchanged, baseline 30s timeout)
    - Error handling: Catch socket.error, socket.timeout, and general Exception
    - Logging: Use existing log parameter and _session_log
  
  component_details:
    - component: _wait_for_failover_state retry wrapper
      responsibility: |
        Wrap single "storage failover show" command with 3-round 60s retry on socket closure.
        Preserve existing timeout behavior; extend recovery window by up to 180s.
      interfaces:
        - Input: channel (SSH), node (str), target_substr (str), total_timeout (int), poll_interval (int), log (Logger)
        - Output: bool (True = success, False = timeout/retry exhausted)
      dependencies:
        - _run_cluster_command (baseline 30s timeout)
        - _open_cluster_channel (reconnect on failure)
      integration_points:
        - Called by: 4a upgrade, 4b netboot flows
        - Polling loop: existing while True → timeout logic (unchanged)
    
    - component: _wait_for_cluster_healthy retry wrapper
      responsibility: |
        Wrap 3-command block (failover show, giveback show, port show) with retry logic.
        On socket error, re-run entire block after 60s wait. Preserve multi-step validation.
      interfaces:
        - Input: channel (SSH), expected_nodes (list), total_timeout (int), poll_interval (int), log (Logger)
        - Output: bool (True = all checks pass, False = timeout/retry exhausted)
      dependencies:
        - _run_cluster_command (baseline 30s timeout per command)
        - _open_cluster_command (reconnect on failure)
        - _parse_failover_show, _cluster_port_health_issues (validation helpers)
      integration_points:
        - Called by: 4a post-takeover verification
        - 3 sequential commands: need atomic retry (all-or-nothing)
    
    - component: _wait_for_cluster_nodes_healthy retry wrapper
      responsibility: |
        Wrap "cluster show" command + port health validation with retry logic.
        Gracefully handle node join timing issues during high-load scenarios.
      interfaces:
        - Input: channel (SSH), target_count (int), total_timeout (int), poll_interval (int), label (str), final_count (int)
        - Output: bool (True = cluster converged, False = timeout/retry exhausted)
      dependencies:
        - _cluster_show_node_status (read-only query)
        - _cluster_port_health_issues (validation helper)
      integration_points:
        - Called by: 4b netboot, cluster add-node flows
        - Long polling intervals (5 min default): retry fills gaps during slow joins

