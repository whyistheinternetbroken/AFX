      - "Unit test: verify all 3 commands re-run after socket.error (atomic behavior)"
      - "Unit test: verify 60s sleep happens between retries"
      - "Unit test: verify function returns True after successful retry"
      - "Unit test: verify function returns False after 3 retries exhaust"
      - "Integration test: confirm T2 retry does not interfere with existing multi-check logic"
    acceptance_criteria:
      - Function accepts socket.error from ANY of 3 commands and enters retry loop
      - On retry: all 3 commands re-run atomically (not per-command)
      - Retry loop: 3 rounds max, 60s wait between rounds
      - Reconnect attempt happens once per retry round
      - Log entries for each retry with round number and which command failed
      - User console message shows retry progress
      - Return value (True/False) unchanged; existing validation logic preserved
      - All 3 checks (connected, no pending giveback, ports healthy) still apply after retry
    failure_modes:
      - scenario: |
          Socket error on command 1 (failover show) triggers retry; command 2/3 succeed
          in original attempt. Retry re-runs all 3 and they all succeed. But in between,
          cluster state changed (node disconnected). Return True (success) but cluster
          is actually degraded.
        likelihood: low
        impact: high
        mitigation: |
          This scenario is inherent to polling any external state. Retry only addresses
          transient connection failures, not state changes. Caller must handle post-check
          failures separately (timeout-based reattempts at polling level, not retry level).
      - scenario: "Retry re-runs 3 commands, causing 3× network overhead and latency"
        likelihood: high
        impact: low
        mitigation: |
          This is acceptable: socket.error means connection is broken anyway.
          Re-running 3 commands << waiting for timeout. 3 commands × 30s timeout = ~90s max per retry round.
    tech_stack:
      - "Python 3"
      - "socket.error / socket.timeout exceptions"
      - "paramiko SSH channel"
    test_coverage: |
      Unit tests:
      - Normal case: no socket error, all 3 commands succeed, returns True
      - Socket error on 1st command (failover show): retry succeeds (all 3 commands), returns True
      - Socket error on 2nd command (giveback show): retry succeeds, returns True
      - Socket error on 3rd command (port show): retry succeeds, returns True
      - Socket error on all 3 retries: returns False after 180s wait
      - Validation logic still works: if retry succeeds but cluster is unhealthy, returns False
      
      Integration: Verify T2 works with 4a post-takeover flow and handles all edge cases

