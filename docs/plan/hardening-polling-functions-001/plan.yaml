tasks:
  # ─────────────────────────────────────────────────────────────────────────
  # WAVE 1: Harden simpler polling functions in parallel
  # ─────────────────────────────────────────────────────────────────────────
  
  - id: hardening-failover-state
    title: Harden _wait_for_failover_state() with 3-round 60s reconnect retry
    description: |
      Add socket-error retry wrapper to _wait_for_failover_state (line 15904).
      
      Current behavior:
      - Polls "storage failover show" at 60s intervals until target_substr is found
      - Timeout is total_timeout (1800s default)
      - On socket closure: command fails, loop sleeps, retries polling
      
      New behavior:
      - On socket.error (or connection timeout): enter 3-round retry loop
      - Wait 60s before each retry attempt (except first)
      - Attempt to reconnect _open_cluster_channel() each round
      - If all 3 retries fail: fall back to existing timeout behavior
      
      Changes:
      1. Wrap main polling loop in try/except
      2. On Exception: attempt 3-round 60s reconnect retry (per _safe_poll pattern)
      3. Log each retry with round number
      4. Print user message: "Waiting 60s for failover state check..." each retry
      5. Preserve total_timeout behavior (no change to overall timeout)
      
      No change to function signature, return type, or caller expectations.
    wave: 1
    agent: gem-implementer
    prototype: false
    covers:
      - "Retry logic for single-command polling"
      - "Socket error recovery (1 command case)"
      - "User messaging for retry attempts"
