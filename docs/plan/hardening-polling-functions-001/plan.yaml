  # ─────────────────────────────────────────────────────────────────────────
  # WAVE 2: Harden complex triple-command polling function
  # ─────────────────────────────────────────────────────────────────────────
  
  - id: hardening-cluster-healthy
    title: Harden _wait_for_cluster_healthy() with 3-round 60s retry for 3-command block
    description: |
      Add socket-error retry wrapper to _wait_for_cluster_healthy (line 15990).
      
      Current behavior:
      - Polls 3 sequential commands (failover show, giveback show, port show) at 60s intervals
      - Validates all three checks pass (connected state, no pending giveback, ports healthy)
      - Timeout is total_timeout (1800s default)
      - On socket closure: ONE command fails, loop sleeps, retries polling (re-runs all 3)
      
      New behavior:
      - On socket.error (or connection timeout) during ANY of 3 commands: enter retry loop
      - Wait 60s before first retry attempt
      - Attempt to reconnect _open_cluster_channel() before re-running all 3 commands
      - Retry up to 3 rounds total
      - If all 3 retries fail: fall back to existing timeout behavior
      
      Changes:
      1. Wrap 3-command block (failover show, giveback show, port show) in try/except
      2. On Exception: attempt 3-round 60s reconnect retry
      3. Each retry re-runs all 3 commands (atomic block; simpler than per-command retry)
      4. Log each retry with round number and which command failed
      5. Print user message: "Waiting 60s for cluster health check..." each retry
      6. Preserve total_timeout behavior
      
      Design note: Atomic block retry (all-or-nothing) is simpler and safer than
      per-command retry. If command 1 succeeds and command 2 fails, retry loop
      re-runs both. This is acceptable because:
      - All 3 commands are read-only (no side effects)
      - Re-running is idempotent
      - Caller expects atomic "cluster healthy" check, not per-command results
      
      This function is MORE COMPLEX than T1/T3 because it runs 3 commands in sequence.
      Wave 2 placement allows T1/T3 validation to inform T2 design.
    wave: 2
    agent: gem-implementer
    prototype: false
    covers:
      - "Retry logic for multi-command polling"
      - "Socket error recovery (3-command atomic case)"
      - "Atomic block retry design"
    priority: high
    status: pending
    dependencies:
